name: Next.js Preview Deployment

on:
  push:
    branches: [main, develop]
    paths:
      - "apps/web/**"
      - "packages/ui/**"
      - "packages/config/**"
      - "packages/types/**"
  pull_request:
    branches: [main, develop]
    paths:
      - "apps/web/**"
      - "packages/ui/**"
      - "packages/config/**"
      - "packages/types/**"

permissions:
  contents: read
  pull-requests: write  # PR에 미리보기 URL 댓글 작성용

jobs:
  deploy-preview:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    outputs:
      preview_url: ${{ steps.deploy.outputs.preview-url }}

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        # package.json의 packageManager 필드 자동 사용

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy to Vercel
        id: deploy
        uses: amondnet/vercel-action@16de52a678f322c2c4e693eb1b0cebe6754e456d # v25.2.0
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./apps/web
          # main 브랜치는 프로덕션, 나머지는 미리보기
          vercel-args: ${{ github.ref == 'refs/heads/main' && '--prod' || '' }}

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const url = '${{ steps.deploy.outputs.preview-url }}';
            const sha = context.payload.pull_request.head.sha.substring(0, 7);
            const body = [
              '## 🔗 Vercel 미리보기 배포',
              '',
              `| 항목 | 값 |`,
              `|------|----|`,
              `| **미리보기 URL** | ${url} |`,
              `| **커밋** | \`${sha}\` |`,
              `| **배포 시점** | ${new Date().toISOString()} |`,
              '',
              '> ⚠️ 이 환경은 프로토타입 시뮬레이션입니다. 백엔드 API 없이는 인증 이후 기능이 동작하지 않을 수 있습니다.',
            ].join('\n');

            // 기존 봇 댓글이 있으면 업데이트, 없으면 새로 작성
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Vercel 미리보기 배포')
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
