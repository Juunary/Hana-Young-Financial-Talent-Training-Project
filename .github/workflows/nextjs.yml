name: Next.js Preview Deployment

on:
  push:
    branches: [main, develop]
    paths:
      - "apps/web/**"
      - "packages/ui/**"
      - "packages/config/**"
      - "packages/types/**"
  pull_request:
    branches: [main, develop]
    paths:
      - "apps/web/**"
      - "packages/ui/**"
      - "packages/config/**"
      - "packages/types/**"

permissions:
  contents: read
  pull-requests: write  # PR에 미리보기 URL 댓글 작성용

jobs:
  deploy-preview:
    name: Deploy to Vercel
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm --filter web type-check

      - name: Deploy to Vercel
        id: deploy
        working-directory: apps/web
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          DEPLOY_URL=$(pnpm dlx vercel deploy ${{ github.ref == 'refs/heads/main' && '--prod' || '' }} --yes --token=$VERCEL_TOKEN)
          echo "preview_url=$DEPLOY_URL" >> $GITHUB_OUTPUT

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const url = '${{ steps.deploy.outputs.preview_url }}';
            const sha = context.payload.pull_request.head.sha.substring(0, 7);
            const body = [
              '## 🔗 Vercel 미리보기 배포',
              '',
              `| 항목 | 값 |`,
              `|------|----|`,
              `| **미리보기 URL** | ${url} |`,
              `| **커밋** | \`${sha}\` |`,
              `| **배포 시점** | ${new Date().toISOString()} |`,
              '',
              '> ⚠️ 이 환경은 프로토타입 시뮬레이션입니다. 백엔드 API 없이는 인증 이후 기능이 동작하지 않을 수 있습니다.',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Vercel 미리보기 배포')
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
